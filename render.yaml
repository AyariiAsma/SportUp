databases:
  - name: sportup-db
    databaseName: sportup
    user: sportup
    plan: free

services:
  - type: web
    name: sportup-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=apps/api
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sportup-db
          property: connectionString
      - key: JWT_SECRET
        value: 11dee0383d8553ec3ea06277a553764907d0b66b9aa90a9794aee146ab21fe67
      - key: JWT_REFRESH_SECRET
        value: 53345c1b4ad38f0d8fc8be4072108ac89554c75d369501ad9468ff7fa2d572b5
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
